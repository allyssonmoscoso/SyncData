name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.2.3)'
        required: true
        default: '1.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64
          - name: win-x64
            os: windows-latest
            rid: win-x64
          - name: macos
            os: macos-14
            rid: osx-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Test (Linux only)
        if: runner.os == 'Linux'
        run: dotnet test SyncData.sln -c Release

      - name: Publish & package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ./build/publish.sh linux-x64 "$VERSION"
          ./build/pack.sh linux-x64 "$VERSION"
          ./build/linux/build-deb.sh "$VERSION"

      - name: Publish & package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          ./build/publish.ps1 -Rid win-x64 -Version $version
          ./build/pack.ps1 -Rid win-x64 -Version $version

      - name: Publish & package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ./build/macos/make-icns.sh
          for rid in osx-arm64 osx-x64; do
            ./build/publish.sh "$rid" "$VERSION"
            ./build/pack.sh "$rid" "$VERSION"
            ./build/macos/build-app.sh "$rid" "$VERSION"
            ./build/macos/build-dmg.sh "$rid" "$VERSION"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SyncData-${{ matrix.name }}
          path: artifacts/packages/**
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: SyncData ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: artifacts/**/*
